# ─────────────────────────────────────────────────────────────
#  b.rief — Instagram news carousel generator
#  Edit this file to rebrand, retune the feed mix, or resize.
# ─────────────────────────────────────────────────────────────

brand:
  name: "b.rief"                          # page name (used in captions, alt text, the editor's brief)
  logo: "assets/logo.png"                 # masthead image at the top of every slide; remove to use `name` as text
  handle: "@b.rief"                       # shown on the last slide + caption
  edition_label: "YOUR DAILY BRIEF"       # left side of the grey dateline bar
  tagline: "The day's biggest headlines. One swipe at a time."
  first_edition_date: 2026-09-27          # edition numbers count up from this day (No. 001)
  colors:
    paper: "#F1EEE8"                      # crumpled-newsprint background
    ink: "#2F2F2F"                        # headline / body text
    accent: "#E3120B"                     # highlighted words, badges (matches the logo's red dot)
    bar: "#474747"                        # dateline bar and category chips

format:
  width: 1080
  height: 1440                            # 3:4 = Instagram's current grid ratio. Use 1350 for 4:5.
  stories: 5                              # story slides per carousel (cover + stories + quick hits)
  quick_hits: 5                           # one-liners on the last slide
  jpeg_quality: 95

editor:
  mode: claude                            # claude = Claude API writes the copy
                                          # basic  = no AI, uses feed titles (for testing)
                                          # manual = stop after fetch; Claude Code / you write edition.json
  model: claude-opus-5
  effort: high                            # low | medium | high — how hard Claude thinks while editing
  language: English
  audience: >-
    Busy people aged 18-35, mostly in India but curious about the world, who
    want the day's biggest headlines in under a minute. They are not news
    junkies: explain things plainly, make them feel smart, never talk down.

news:
  max_age_hours: 26                       # ignore anything older than this
  enrich_top: 24                          # fetch article pages for the top N clusters (images + text)
  per_category_max: 2                     # basic mode: max stories from one category
  feeds:
    # Google News (India edition) — best signal for "what is everyone covering right now".
    - {url: "https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en", category: TOP, top: true}
    - {url: "https://news.google.com/rss/headlines/section/topic/NATION?hl=en-IN&gl=IN&ceid=IN:en", category: INDIA}
    - {url: "https://news.google.com/rss/headlines/section/topic/WORLD?hl=en-IN&gl=IN&ceid=IN:en", category: WORLD}
    - {url: "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-IN&gl=IN&ceid=IN:en", category: MONEY}
    - {url: "https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=en-IN&gl=IN&ceid=IN:en", category: TECH}
    - {url: "https://news.google.com/rss/headlines/section/topic/SPORTS?hl=en-IN&gl=IN&ceid=IN:en", category: SPORTS}
    - {url: "https://news.google.com/rss/headlines/section/topic/ENTERTAINMENT?hl=en-IN&gl=IN&ceid=IN:en", category: CULTURE}
    - {url: "https://news.google.com/rss/headlines/section/topic/SCIENCE?hl=en-IN&gl=IN&ceid=IN:en", category: SCIENCE}
    # Publisher feeds — direct links, so we can pull photos and article text.
    - {url: "https://www.thehindu.com/news/national/feeder/default.rss", category: INDIA}
    - {url: "https://indianexpress.com/section/india/feed/", category: INDIA}
    - {url: "https://feeds.feedburner.com/ndtvnews-top-stories", category: TOP, top: true}
    - {url: "https://www.hindustantimes.com/feeds/rss/india-news/rssfeed.xml", category: INDIA}
    - {url: "https://www.livemint.com/rss/news", category: MONEY}
    - {url: "https://economictimes.indiatimes.com/rssfeedstopstories.cms", category: MONEY}
    - {url: "https://feeds.bbci.co.uk/news/world/rss.xml", category: WORLD}
    - {url: "https://www.aljazeera.com/xml/rss/all.xml", category: WORLD}
    - {url: "https://www.theguardian.com/world/rss", category: WORLD}
    - {url: "https://techcrunch.com/feed/", category: TECH}
    - {url: "https://www.theverge.com/rss/index.xml", category: TECH}
    - {url: "https://www.espncricinfo.com/rss/content/story/feeds/0.xml", category: SPORTS}
